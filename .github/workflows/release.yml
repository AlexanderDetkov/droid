name: Release

# Pushing a tag such as v0.9 builds the release APKs and drafts a GitHub release with them and proot's exact source.
# The APKs are signed when the repository has these secrets: KEYSTORE_BASE64 (the keystore file, base64), and
# KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD. Every release must use the same key, or users can't update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::warning::No signing key: the APKs are unsigned and won't install"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Test and build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir out
          for abi in arm64-v8a x86_64; do
            f=$(ls app/build/outputs/apk/release/app-$abi-release*.apk)
            cp "$f" "out/droid-${TAG#v}-${abi%%-*}.apk"
          done
          tools/proot/build.sh --source "out/proot-source.tar.gz"
          gh release create "$TAG" out/* --draft --title "Droid ${TAG#v}" --generate-notes
