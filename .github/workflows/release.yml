name: Release

# Pushing a tag such as v0.9 builds the release APKs and drafts a GitHub release with them and proot's exact source.
# The tag must be the app's versionName with a v. The APKs are signed with these secrets, and without them there's no
# release: KEYSTORE_BASE64 (the keystore file, base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD. Every release must
# use the same key, or users can't update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: The tag is the app's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$v" != "$TAG" ]; then echo "::error::Tag $TAG but versionName is $v (and raise versionCode too)"; exit 1; fi
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::No signing key: unsigned APKs won't install, so there's no release"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Test and build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir out
          for abi in arm64-v8a x86_64; do
            f=$(ls app/build/outputs/apk/release/app-$abi-release*.apk)
            cp "$f" "out/droid-${abi%%-*}.apk"  # the same names each release: releases/latest/download/droid-arm64.apk
          done
          tools/proot/build.sh --source "out/proot-source.tar.gz"
          gh release create "$TAG" out/* --draft --title "Droid ${TAG#v}" --generate-notes
